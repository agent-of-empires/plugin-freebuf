name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  manifest:
    name: Validate manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse aoe-plugin.toml
        run: |
          python3 - <<'PY'
          import tomllib
          with open("aoe-plugin.toml", "rb") as f:
              tomllib.load(f)
          print("aoe-plugin.toml parses as TOML")
          PY

  node:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # acp-adapter/ is a separate package with its own deps and test runner, so the
  # root checks above never reach it. Its sources are linted with the root config.
  adapter:
    name: Lint, type-check, test ACP adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx eslint acp-adapter/src acp-adapter/test
      - run: npm ci
        working-directory: acp-adapter
      - run: npm run typecheck
        working-directory: acp-adapter
      - run: npm test
        working-directory: acp-adapter
