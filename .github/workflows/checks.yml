name: Checks

on:
  push:
    branches: [main]
  pull_request:

# Every job only reads the checkout, and host-build runs `npm install` with the
# workflow token, so pin the scope to read-only.
permissions:
  contents: read

jobs:
  manifest:
    name: Validate manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse aoe-plugin.toml
        run: |
          python3 - <<'PY'
          import tomllib
          with open("aoe-plugin.toml", "rb") as f:
              tomllib.load(f)
          print("aoe-plugin.toml parses as TOML")
          PY

  node:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # acp-adapter/ is a separate package with its own deps and test runner, so the
  # root checks above never reach it. Its sources are linted with the root config.
  adapter:
    name: Lint, type-check, test ACP adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx eslint acp-adapter/src acp-adapter/test
      - run: npm ci
        working-directory: acp-adapter
      - run: npm run typecheck
        working-directory: acp-adapter
      - run: npm test
        working-directory: acp-adapter

  host-build:
    name: Build output stays under .aoe-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The host re-hashes the installed tree at load and only excludes
      # .aoe-build/, so a build step that writes anywhere else silently drops the
      # plugin to community trust. test/build-output.test.ts runs the manifest's
      # build steps and asserts the hash is unchanged.
      - run: npm install
      - run: npx vitest run test/build-output.test.ts
