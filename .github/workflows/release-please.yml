name: Release Please

# Mirrors the core repo's release-plz flow. Every push to main refreshes one
# `chore(release): X.Y.Z` PR that bumps the version in package.json,
# package-lock.json and aoe-plugin.toml and writes CHANGELOG.md from the commit
# subjects. Merging that PR creates the `vX.Y.Z` tag and a GitHub Release whose
# notes are that changelog section; release.yml then attaches the source archive
# to it. Config: release-please-config.json, .release-please-manifest.json.
#
# RELEASE_TOKEN is required for the release to start release.yml: events caused
# by GITHUB_TOKEN start no workflows. Without it the PR, tag and release are
# still made without the archive -- attach it by hand with
# `gh workflow run release.yml -f tag=vX.Y.Z`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel: a cancelled run can leave the release PR half-updated.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Update release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          # A PAT (or GitHub App token) with contents: write and
          # pull-requests: write, so the tag it pushes starts release.yml.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          target-branch: main

      # `pr` is a JSON object carrying the release PR's title and body. Passed
      # through the environment it is data, not shell syntax: interpolated into
      # the script instead, the quotes in `chore(release): X.Y.Z` end the shell
      # string and the parentheses fail the step after the PR was updated.
      - name: Report
        env:
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          printf 'released=%s\ntag=%s\npr=%s\n' \
            "${RELEASE_CREATED:-}" "${RELEASE_TAG:-}" "${RELEASE_PR:-}"
