# Freebuf -- an Agent of Empires plugin.
#
# Manifest schema: aoe-plugin-api/src/manifest.rs in agent-of-empires. The host
# parses this strictly (deny_unknown_fields), so every key must match a field in
# that schema. Field-by-field reference:
# https://agent-of-empires.com/docs/plugin-api/

id = "dev.example.aoe-freebuf"
name = "Freebuf"
version = "0.1.0"
# Manifest schema / host API version. The host rejects a manifest whose
# api_version it does not support. 18 is the newest version this plugin's
# contributions need; 19 adds only the provider-native agent-integration
# contract (`[[agent_integrations]]` plus the `session.integration` capability),
# which released hosts do not parse yet -- declaring it gets the manifest
# rejected, not a degraded install. Raise this to 19 with that block once the
# host ships it (see src/integration.ts, which is that path's report writer).
api_version = 18
# Host-app compatibility range (a different axis from api_version). The host
# refuses install/update outside this range. Requires api_version >= 4.
aoe_version = ">=1.11.0, <2.0.0"
description = "An Agent of Empires plugin for the FreeBuff coding agent."

# Capability grants are prompted at install and pinned to the manifest hash.
# Declare only what the worker actually uses. `runtime.worker` runs the worker;
# the worker lists sessions through the host to find freebuff ones
# (`session.read`), reads each session's pane with `aoe session capture` to
# classify its screen like a built-in agent's detector (`process.spawn`), reads
# Freebuff's own state directory for the status command (`fs.read`), and raises
# the host's attention flag by writing into its per-session hook directory under
# /tmp (`fs.write`).
capabilities = ["runtime.worker", "session.read", "fs.read", "fs.write", "process.spawn"]

# Commands the plugin contributes (palette / CLI), namespaced by the host as
# plugin.dev.example.aoe-freebuf.<id>. The command-id -> worker RPC mapping
# is host convention; the worker answers a method ending in `.status`.
[[commands]]
id = "status"
title = "Freebuf: status"
description = "Show the Freebuf status summary."

# A setting, rendered on the TUI and web settings surfaces and stored under
# [plugins."dev.example.aoe-freebuf".settings]. The worker reads it back at
# runtime via the config.get host RPC.
[[settings]]
key = "enabled"
label = "Enable Freebuf"
description = "Master toggle for the plugin's behavior."
type = "boolean"
default = true

# Attention is deliberately not a slot. The worker classifies each session's
# own pane (blocking dialog / working / parked, the rules a built-in agent's
# detector uses) and raises the host's attention flag by writing
# `/tmp/aoe-hooks-<euid>/<session id>/attention.json` (see src/attention.ts),
# which is what the attention sort and the TUI's jump-to-next-attention read for
# every session. A `row-column` cell would only add text those orderings ignore.

# A UI extension point. The host renders the slot; the worker pushes display
# state through the ui.state.set host RPC. `pane` is a dockable tool-window in a
# session's view.
[[ui]]
slot = "pane"
id = "aoe_freebuf_pane"

# Tier 1 worker: the executable the host spawns and supervises, speaking ndjson
# JSON-RPC over stdio. The entrypoint MUST be plugin-relative so the daemon's
# PATH never decides whether the worker launches. The build steps run in the
# user's interactive shell at install/update, where PATH is reliable. They build
# into .aoe-build/ (the host's BUILD_OUTPUT_DIR), which the host excludes from
# the plugin tree hash. Scoped to posix.
[runtime]
kind = "command"
command = [".aoe-build/node/bin/aoe-freebuf-worker"]

[[runtime.build]]
command = ["npm", "install"]
platforms = ["linux", "macos"]

[[runtime.build]]
command = ["npm", "run", "build"]
platforms = ["linux", "macos"]

# Generate a plugin-relative launcher under .aoe-build/node/bin that pins the
# build-time node binary, so runtime launch never depends on the daemon PATH.
[[runtime.build]]
command = ["node", "scripts/write-aoe-wrapper.mjs"]
platforms = ["linux", "macos"]
